# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Google Antigravity"

ai_usage_summary: |
  Used Google Antigravity (Advanced Agentic Coding assistant) for end-to-end pair programming.
  Antigravity designed the architecture, implemented the 5-layer heuristic engine, built the
  honeypot detection system, and orchestrated the ranking pipeline. No candidate data was
  fed into any LLM at runtime due to CPU constraints.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Rule-based, 5-layer heuristic ranker with explicit reasoning generation and decoupled honeypot detection.
  Scoring components: Title & Career Fit (40%, highest weight to avoid keyword stuffers), Skills Trust
  (20%, cross-validates with endorsements & durations), Behavioral Availability (20%, uses response rates),
  Logistics (10%), and Experience/Education (10%).
  
  Honeypot detection uses 7 strict checks (e.g., impossible tenure, expert with zero evidence, career overlaps)
  and penalizes composite scores by 40%. The system processes 100K candidates natively in Python (no ML libraries)
  in under 3 minutes on a single CPU core, producing detailed, fact-based reasoning for the top 100.

